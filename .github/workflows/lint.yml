name: Pre-commit Hooks


on: [pull_request]

jobs:
  run-pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 2 

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install ruff
      run: pip install ruff

    - name: Run ruff format checker
      run: ruff format --check

    - name: Run ruff format checker
      run: ruff check